name: CI
on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
  generated-integrations:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test-fixture/package-lock.json
      - run: npm ci
      - run: npm ci --prefix test-fixture
      - run: npm run test:templates -- --build
      - run: npm run build --prefix test-fixture
